<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .in  { fill: #182533; }
      .out { fill: #2b5278; }
      .chip{ fill: #182533; opacity: .85; }
      .t   { fill: #f5f5f5; font-size: 13px; }
      .dim { fill: #7f91a4; font-size: 11px; }
      .mono{ fill: #f5f5f5; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .btn { fill: #2b5278; opacity: .55; }
      .bt  { fill: #eaf2fb; font-size: 12px; }
      g.msg { opacity: 0; }
    </style>
  </defs>

  <rect width="640" height="570" fill="#0e1621"/>

  <!-- header -->
  <rect width="640" height="44" fill="#17212b"/>
  <text x="16" y="21" class="t" font-weight="600">#api</text>
  <text x="16" y="36" class="dim">nightmux · topic bound to tmux: api</text>

  <!-- 23:47 -->
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="0.2s" fill="freeze"/>
    <rect x="292" y="58" width="56" height="20" rx="10" class="chip"/>
    <text x="320" y="72" class="dim" text-anchor="middle">23:47</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="0.6s" fill="freeze"/>
    <rect x="256" y="88" width="368" height="32" rx="10" class="out"/>
    <text x="272" y="109" class="t">refactor the auth module — tests green, then commit</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="1.4s" fill="freeze"/>
    <rect x="16" y="130" width="212" height="30" rx="10" class="in"/>
    <text x="30" y="150" class="t">⚙️ api · Opus 5 · 41% ctx</text>
  </g>

  <!-- 02:14 -->
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="2.6s" fill="freeze"/>
    <rect x="292" y="172" width="56" height="20" rx="10" class="chip"/>
    <text x="320" y="186" class="dim" text-anchor="middle">02:14</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="3.0s" fill="freeze"/>
    <rect x="16" y="200" width="420" height="48" rx="10" class="in"/>
    <text x="30" y="220" class="t">⏸ api hit the usage limit</text>
    <text x="30" y="238" class="dim" font-size="12">5-hour window spent — resumes 04:11, resuming itself with 'continue'</text>
  </g>

  <!-- 04:11 -->
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="4.4s" fill="freeze"/>
    <rect x="292" y="260" width="56" height="20" rx="10" class="chip"/>
    <text x="320" y="274" class="dim" text-anchor="middle">04:11</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="4.8s" fill="freeze"/>
    <rect x="16" y="288" width="300" height="30" rx="10" class="in"/>
    <text x="30" y="308" class="t">▶️ api resumed · sending queued prompt</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="5.6s" fill="freeze"/>
    <rect x="16" y="326" width="330" height="50" rx="10" class="in"/>
    <text x="30" y="346" class="t">🟠 needs input · api</text>
    <text x="30" y="365" class="mono">Bash(git commit -m "fix token expiry")</text>
    <rect x="16"  y="384" width="100" height="28" rx="6" class="btn"/>
    <text x="66"  y="402" class="bt" text-anchor="middle">1. Yes</text>
    <rect x="122" y="384" width="190" height="28" rx="6" class="btn"/>
    <text x="217" y="402" class="bt" text-anchor="middle">2. Yes, don't ask again</text>
    <rect x="318" y="384" width="80" height="28" rx="6" class="btn"/>
    <text x="358" y="402" class="bt" text-anchor="middle">3. No</text>
  </g>

  <!-- 07:02 -->
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="6.8s" fill="freeze"/>
    <rect x="292" y="424" width="56" height="20" rx="10" class="chip"/>
    <text x="320" y="438" class="dim" text-anchor="middle">07:02</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="7.2s" fill="freeze"/>
    <rect x="580" y="452" width="44" height="30" rx="10" class="out"/>
    <text x="602" y="472" class="t" text-anchor="middle">1</text>
  </g>
  <g class="msg"><animate attributeName="opacity" to="1" dur="0.45s" begin="8.0s" fill="freeze"/>
    <rect x="16" y="490" width="440" height="48" rx="10" class="in"/>
    <text x="30" y="510" class="t">✅ api</text>
    <text x="30" y="528" class="dim" font-size="12">Token expiry used &lt; instead of &lt;= — fixed, tests pass, committed.</text>
  </g>

  <g class="msg"><animate attributeName="opacity" to="1" dur="0.6s" begin="9.0s" fill="freeze"/>
    <text x="320" y="558" class="dim" text-anchor="middle" font-style="italic">you slept through all of it</text>
  </g>
</svg>
