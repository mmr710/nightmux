<html><head><meta charset="utf-8">

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0%, #151a2a, #07090f 70%);color:#cdd6f4;font:14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif}
pre, canvas, .nav a, .meter, h1 {font-family: ui-monospace, Menlo, Consolas, monospace}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:0;background:rgba(7,9,15,0.85);backdrop-filter:blur(16px);z-index:2;box-shadow:0 4px 30px rgba(0,0,0,0.4)}

.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.nav a{font-size:13px;color:#cdd6f4;text-decoration:none;border:1px solid #2d3346;border-radius:8px;padding:6px 12px;background:linear-gradient(180deg, #1b2133, #131722);transition:all 0.2s;box-shadow:0 2px 5px rgba(0,0,0,0.2)}

#rp[hidden]{display:none}#rps{flex:1;min-width:0;accent-color:#e0af68}
#offline{margin:10px 16px 0;padding:10px 12px;border:1px solid #f8514955;border-radius:8px;background:#1a1012;font-size:12px;color:#f0a0a0}

.room{background:linear-gradient(145deg, #101423 0%, #0d1120 100%);border:1px solid rgba(122,162,247,0.15);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);position:relative;transition:all 0.3s cubic-bezier(0.25,0.8,0.25,1);animation:float 6s ease-in-out infinite}

.room h2{font-size:15px;font-weight:600;margin:0;padding:14px 18px;background:linear-gradient(90deg, rgba(20,26,46,0.8), rgba(27,33,51,0.9));backdrop-filter:blur(12px);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(122,162,247,0.1);color:#7aa2f7;text-shadow:0 0 10px rgba(122,162,247,0.3)}

canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-bottom:none;border-radius:0 0 16px 16px;background:radial-gradient(circle at center, #0d1120, #05070f)}

[data-skin=matrix] canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-bottom:none;border-radius:0 0 16px 16px;background:radial-gradient(circle at center, #0d1120, #05070f)}
[data-skin=gameboy] canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-bottom:none;border-radius:0 0 16px 16px;background:radial-gradient(circle at center, #0d1120, #05070f)}
[data-skin=vapor] canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-bottom:none;border-radius:0 0 16px 16px;background:radial-gradient(circle at center, #0d1120, #05070f)}
[data-skin=mono] canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;border-bottom:none;border-radius:0 0 16px 16px;background:radial-gradient(circle at center, #0d1120, #05070f)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:16px;background:rgba(0,0,0,0.25)}
button.chip{font:inherit;background:linear-gradient(180deg, #1b2133, #151a28);color:#cdd6f4;border:1px solid #2b3452;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,0.2);transition:all 0.2s}

background:radial-gradient(100% 100% at 50% 0%, rgba(138,43,226,0.15) 0%, transparent 80%), #0d1117;
font-family:system-ui,-apple-system,sans-serif;}

body.demo header,body.demo main,body.demo #sheet{display:none}
#stage{display:none}
body.demo #stage{display:block}
</style></head><body>

<h1 id="rtitle" style="display:none">NIGHTMUX REEL</h1>
<canvas id="stage"></canvas>
<div id="sheet"></div><div id="toast"></div>
<script>
// ---------- pixel kit ----------
const RH = 128, SW = 64, Q = new URLSearchParams(location.search), DEMO = Q.has('demo'), REEL = Q.has('reel'),
  REPLAY = Q.has('replay');
let T = null;   // replay: the recorded moment on screen, in ms
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16), m = (x, y) => Math.round(x + (y - x) * t);
  return '#' + ((1 << 24) | (m(a >> 16, b >> 16) << 16) | (m(a >> 8 & 255, b >> 8 & 255) << 8)
    | m(a & 255, b & 255)).toString(16).slice(1);
}
function rng(seed) { let s = seed >>> 0 || 7; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
// 3x5 bitmap font: the clock, labels and captions are part of the pixel art.
const FONT = {A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',
  E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',
  J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',
  O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',
  T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011010101010',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111',
  '3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010',
  '8':'111101111101111','9':'111101111001110',':':'000010000010000','.':'000000000000010',',':'000000000010100',
  '!':'010010010000010','?':'110001010000010','-':'000000111000000','>':'100010001010100','_':'000000000000111',
  '/':'001001010100100',' ':'000000000000000','·':'000000010000000','✓':'000001101010000','+':'000010111010000',
  "'":'010010000000000','(':'010100100100010',')':'010001001001010','#':'101111101111101','@':'010101111100011'};
const glyph = ch => FONT[ch] || FONT['?'];
const tw = s => [...String(s).toUpperCase()].reduce((a, ch) => a + glyph(ch).length / 5 + 1, 0);
function text(R, s, x, y, c) {
  for (const ch of String(s).toUpperCase()) {
    const gl = glyph(ch), w = gl.length / 5;
    for (let i = 0; i < gl.length; i++) if (gl[i] === '1') R(c, x + i % w, y + (i / w | 0), 1, 1);
    x += w + 1;
  }
}
function spr(R, rows, x, y, pal) {
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const c = pal[row[i]]; if (c) R(c, x + i, y + j, 1, 1); } });
}
const LOOK = {
  claude:   {shirt: '#d97757', shade: '#a3502f', hair: '#4a2f22', skin: '#f2c79b', hat: 'hood'},
  codex:    {shirt: '#10a37f', shade: '#0a7259', hair: '#2b2f45', skin: '#e8b48a', hat: 'cap'},
  agy:      {shirt: '#4285f4', shade: '#2c5fb8', hair: '#151515', skin: '#c98b5e', hat: 'headset'},
  opencode: {shirt: '#a0a7b4', shade: '#6f7684', hair: '#6b4f3a', skin: '#f5d0a9', hat: 'beanie'},
  gemini:   {shirt: '#8e75ff', shade: '#6250c4', hair: '#c9a227', skin: '#f2c79b', hat: 'none'},
  aider:    {shirt: '#e0af68', shade: '#ad8040', hair: '#2b2f45', skin: '#e8b48a', hat: 'none'},
  cursor:   {shirt: '#e6e9f2', shade: '#9aa0b0', hair: '#151515', skin: '#e8b48a', hat: 'cap'},
  amp:      {shirt: '#f34e3f', shade: '#b0342a', hair: '#2b2f45', skin: '#f2c79b', hat: 'headset'},
  goose:    {shirt: '#f6d365', shade: '#c9a227', hair: '#6b4f3a', skin: '#c98b5e', hat: 'beanie'},
  qwen:     {shirt: '#615ced', shade: '#4440b0', hair: '#151515', skin: '#f5d0a9', hat: 'hood'},
};
const look = k => LOOK[k] || {shirt: '#c0caf5', shade: '#8189b0', hair: '#3b4261', skin: '#f2c79b', hat: 'none'};
const color = k => look(k).shirt;
const HEAD = ['.ooooo.', 'ohhhhho', 'ohhhsso', 'ohhssEo', 'ohsssso', 'ohsssSo', '.oSsso.', '..oso..'];
const TORSO = ['..cccc..', '.cccccc.', 'cccccccc', 'Ccccccc.', 'Ccccccc.', 'Ccccccc.', 'Ccccccc.', 'Ccccccc.',
               'pppppppp', 'pppppppp'];

// ---------- the room ----------
const SKY = new Map();
function skyline(w) {
  if (SKY.has(w)) return SKY.get(w);
  const r = rng(w * 31), stars = [], blds = [];
  for (let i = 0; i < w / 5; i++) stars.push([4 + r() * (w - 8), 10 + r() * 26, r() * 9 | 0]);
  for (let x = 8; x < w - 8;) {
    const bw = 6 + (r() * 12 | 0), bh = 6 + (r() * 20 | 0), lit = [];
    for (let wy = 52 - bh + 2; wy < 50; wy += 3) for (let wx = x + 1; wx < x + bw - 1; wx += 2)
      if (r() < .35) lit.push([wx, wy, r() * 60 | 0]);
    blds.push([x, bw, bh, lit]); x += bw + (r() * 3 | 0);
  }
  const v = {stars, blds}; SKY.set(w, v); return v;
}

function backdrop(R, g, w, f, o) {
  const dawn = o.dawn || 0, day = o.day || 0, sk = skyline(w);
  R('#141a2e', 0, 0, w, 70);
  for (let y = 8; y < 52; y++) {                                   // sky through the window
    const t = (y - 8) / 44;
    R(mix(mix(mix('#070a1c', '#2a1d4a', t), mix('#3d5aa8', '#ffb86b', t), dawn),
          mix('#4f8fd9', '#bfe3ff', t), day), 8, y, w - 16, 1);
  }
  for (const [x, y, p] of sk.stars) if (dawn < .7 && (f + p) % 11 > 1)
    R(mix('#e0e6ff', mix('#3d5aa8', '#ffb86b', (y - 8) / 44), dawn * 1.4 > 1 ? 1 : dawn * 1.4), x, y, 1, 1);
  if (f % 97 < 8 && dawn < .3) {                                   // shooting star
    const t = f % 97, sx = w * .2 + t * 6, sy = 12 + t * 2;
    for (let k = 0; k < 5; k++) R(k ? 'rgba(224,230,255,' + (.6 - k * .12) + ')' : '#ffffff', sx - k * 2, sy - k, 2, 1);
  }
  const mx = w - 46, my = 13, moon = mix('#f5e6b8', '#ffe9c7', dawn);
  if (dawn < .85) {
    g.globalAlpha = 1 - dawn;
    const halo = g.createRadialGradient(mx, my, 2, mx, my, 16);
    halo.addColorStop(0, 'rgba(245,230,184,.22)'); halo.addColorStop(1, 'rgba(245,230,184,0)');
    g.fillStyle = halo; g.fillRect(mx - 16, my - 16, 32, 32);
    for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++)
      if (dx * dx + dy * dy <= 25 && (dx - 2.5) ** 2 + (dy + 1.5) ** 2 > 16) R(moon, mx + dx, my + dy, 1, 1);
    g.globalAlpha = 1;
  }
  if (dawn > 0) {                                                 // the sun comes up with the reset
    const sx = 52, sy = 58 - dawn * 30 - day * 14;          // and keeps climbing by day
    const glow = g.createRadialGradient(sx, sy, 2, sx, sy, 30);
    glow.addColorStop(0, 'rgba(255,207,112,' + .5 * dawn + ')'); glow.addColorStop(1, 'rgba(255,207,112,0)');
    g.fillStyle = glow; g.fillRect(8, 8, w - 16, 44);
    for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++)
      if (dx * dx + dy * dy <= 36 && sy + dy < 52) R('#ffcf70', sx + dx, sy + dy, 1, 1);
  }
  for (const [x, bw, bh, lit] of sk.blds) {
    R(mix(mix('#0b0e1f', '#3a2c4a', dawn), '#6b7a99', day * .7), x, 52 - bh, bw, bh);
    R(mix(mix('#141833', '#4d3b5e', dawn), '#8a97b3', day * .7), x, 52 - bh, bw, 1);
    for (const [wx, wy, p] of lit) if ((f / 8 + p | 0) % 13 && dawn < .9) R(mix('#f2c46d', '#7a6a7a', dawn), wx, wy, 1, 1);
  }
  R('#2b3452', 6, 6, w - 12, 2); R('#2b3452', 6, 52, w - 12, 3); R('#3a4466', 4, 55, w - 8, 2);  // frame + sill
  R('#2b3452', 6, 6, 2, 48); R('#2b3452', w - 8, 6, 2, 48);
  for (let x = SW; x < w - 8; x += SW) R('#2b3452', x, 8, 2, 44);
  R('#11162a', 0, 57, w, 13); R('#1f2742', 0, 60, w, 1);           // wainscot
  R('#0a0d1a', 0, 70, w, 2);                                       // baseboard
  for (let y = 72, row = 0; y < RH; y += 5, row++) {               // floor planks
    R(row % 2 ? '#2a2132' : '#261e2e', 0, y, w, 5); R('#1c1622', 0, y + 4, w, 1);
    for (let x = (row * 17) % 23; x < w; x += 23) R('#1c1622', x, y, 1, 4);
  }
  text(R, 'NIGHTMUX', 8, 62, '#e0af68');                          // sign + clock on the wainscot
  R('#e0af68', 4, 63, 2, 3);
  if (o.clock) { R('#05070d', w - 30, 61, 26, 8); R('#1b2133', w - 30, 61, 26, 1); text(R, o.clock, w - 28, 63, '#9ece6a'); }
  for (const px of [1]) {               // plants, where there is floor
    R('#8a4b2c', px + 1, 112, 7, 8); R('#a35c37', px + 1, 112, 7, 1);
    for (const [lx, ly, lc] of [[3, 101, 0], [1, 104, 1], [5, 103, 1], [2, 108, 0], [6, 107, 0], [4, 98, 1]])
      R(lc ? '#4f9d5b' : '#3b7a46', px + lx + (f % 40 < 20 && ly < 102 ? 1 : 0), ly, 2, 5);
  }
}

function screen(R, x, y, d, f) {        // 16x11 screen content; returns the glow colour or null
  const col = color(d.agent), st = d.state;
  if (st === 'gone') { R('#05070d', x, y, 16, 11); R('#151826', x + 10, y + 1, 3, 1); R('#151826', x + 11, y + 2, 3, 1); return null; }
  if (st === 'shell') { R('#050b07', x, y, 16, 11); text(R, '>', x + 1, y + 2, '#9ece6a'); if (f % 4 < 2) R('#9ece6a', x + 5, y + 6, 3, 1); return '#9ece6a'; }
  if (st === 'limit') {
    R('#2a0f17', x, y, 16, 11); text(R, 'ZZ', x + 4, y + 1, '#f7768e');
    R('#4a1a26', x + 1, y + 8, 14, 2); R('#f7768e', x + 1, y + 8, Math.max(1, 14 * (d.prog || 0) | 0), 2); return '#f7768e';
  }
  if (st === 'waiting') {
    R('#101528', x, y, 16, 11); R('#e0af68', x + 1, y + 1, 14, 2); R('#1c2238', x + 1, y + 3, 14, 7);
    R('#9ece6a', x + 3, y + 6, 4, 2); R('#f7768e', x + 9, y + 6, 4, 2); return '#e0af68';
  }
  if (st === 'unknown') { for (let i = 0; i < 16; i++) for (let j = 0; j < 11; j++)
    R((i * 7 + j * 13 + f * 5) % 9 < 4 ? '#3b4261' : '#1a1e2e', x + i, y + j, 1, 1); return '#3b4261'; }
  if (st === 'busy') {
    R('#0f1424', x, y, 16, 11);
    const C = ['#7aa2f7', '#9ece6a', '#e0af68', '#bb9af7', '#7dcfff', col];
    for (let r = 0; r < 5; r++) {
      const k = r + (f >> 1), ind = k % 3, w1 = 2 + k * 7 % 5, w2 = Math.min(1 + k * 5 % 6, 14 - ind - w1);
      R(C[k % 6], x + 1 + ind, y + 1 + r * 2, w1, 1); if (w2 > 0) R(C[(k + 2) % 6], x + 2 + ind + w1, y + 1 + r * 2, w2, 1);
    }
    return col;
  }
  R('#151a2e', x, y, 16, 11);                                      // idle: lock screen, a crescent
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++)
    if (dx * dx + dy * dy <= 9 && (dx - 1.6) ** 2 + (dy + .8) ** 2 > 5) R('#e0af68', x + 8 + dx, y + 5 + dy, 1, 1);
  return '#2a3352';
}

function bubble(R, x, y, glyph, fg, bob) {
  y += bob;
  R('#0b0d14', x - 1, y - 1, 11, 10); R('#f2f4f8', x, y, 9, 8); R('#0b0d14', x + 2, y + 8, 3, 2);
  R('#f2f4f8', x + 3, y + 8, 1, 1); text(R, glyph, x + 3, y + 2, fg);
}

// ---------- the lounge: where agents go when they are not working ----------
// Idle agents wander off for coffee, the TV or the toilet and come back; one
// that hit its limit goes to bed until the window resets. A pure function of
// the frame and when the state last changed, so reel and demo frames replay.
const LW = 112, SPEED = DEMO ? 3 : 2, GRACE = DEMO ? 6 : 24, DWELL = DEMO ? [4, 20] : [30, 70];
const SPOT = {wc: 9, coffee: 30, tv1: 52, tv2: 68, bed: 90, couch: 50};
// A walk speeds up out of the chair and slows into the spot (half pace at either
// end, half again in the middle), and each agent has its own stride.
const RISE = 4;
function stroll(a, b, u, pace) {                // where a walk from a to b is u frames in, or null
  const dist = Math.abs(b - a), w = dist / pace;
  if (u >= w) return null;
  const s = u / w, e = s - Math.sin(2 * Math.PI * s) / (4 * Math.PI);
  return {x: a + Math.sign(b - a) * dist * e, pose: 'walk', dir: Math.sign(b - a), walked: dist * e};
}
function plan(d, i, f, L0, x0) {
  const t = f - (d.since || 0), home = x0 + 15, pace = SPEED * (.85 + (i * 0.13) % .3);
  const go = (tx, u, pose, spot) => {          // stand up, walk there, do the thing
    if (u < RISE) return {x: home, pose: 'rise', dir: Math.sign(tx - home)};
    return stroll(home, tx, u - RISE, pace) || {x: tx, pose, spot};
  };
  if (d.state === 'limit') {
    if (t < 14) return null;                     // slumps first, then gives up and goes to bed
    return go(L0 + (i % 2 ? SPOT.couch : SPOT.bed), t - 14, 'lie', i % 2 ? 'couch' : 'bed');
  }
  if (d.state !== 'idle' || t < GRACE) return null;
  const P = 340, u0 = t - GRACE, c = Math.floor(u0 / P);
  let u = u0 % P;
  const spot = ['coffee', 'tv', 'wc', 'tv', 'coffee', 'wc'][(c + i * 2) % 6];
  const tx = L0 + SPOT[spot === 'tv' ? (i % 2 ? 'tv2' : 'tv1') : spot];
  const walk = Math.abs(tx - home) / pace + RISE, desk = DWELL[0] + (i * 37) % DWELL[1];
  const stay = P - desk - 2 * walk;
  if (stay < 40 || u < desk) return null;
  u -= desk;
  if (u < walk + stay) return go(tx, u, spot === 'tv' ? 'sit' : spot === 'wc' ? 'in' : 'stand', spot);
  u -= walk + stay;
  return stroll(tx, home, u, pace);
}

function actor(R, d, a, f, i) {
  const L = look(d.agent), pal = {o: '#0b0d14', h: L.hair, s: L.skin, S: mix(L.skin, '#5a3a2a', .35),

function deskX(room, session, pad) {
  const i = room.desks.findIndex(d => d.session === session);
  return i < 0 ? null : pad + i * SW;
}

function effects(R, room, pad, f, fx) {
  for (const e of fx || []) {
    const age = f - e.start;
    if (e.type === 'folder' && age >= 0 && age < 18) {
      const a = deskX(room, e.from, pad), b = deskX(room, e.to, pad);
      if (a == null || b == null) continue;
      const t = age / 17, at = u => [a + 18 + (b - a) * u, 78 - Math.sin(Math.PI * u) * 16];
      for (let k = 1; k < 5; k++) { const [tx, ty] = at(Math.max(0, t - k * .05)); R('rgba(246,211,101,' + (.5 - k * .1) + ')', tx + 2, ty + 2, 3, 2); }
      const [x, y] = at(t);
      R('#0b0d14', x - 1, y - 1, 9, 7); R('#e0af68', x, y, 7, 5); R('#c48a3a', x, y, 3, 1); R('#f6d365', x + 1, y + 2, 5, 1);
      if (age < 7) bubble(R, a + 20, 50, '>', '#e0af68', 0);        // "yours"
      if (age > 11) bubble(R, b + 20, 50, '!', '#2f8f3a', 0);       // "got it"
    }
    if ((e.type === 'sparkle' || e.type === 'check') && age >= 0 && age < 16) {
      const x = deskX(room, e.on, pad); if (x == null) continue;
      const cx = x + 20, cy = 70, r = 4 + age / 2;
      for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0], [.7, .7], [-.7, -.7], [.7, -.7], [-.7, .7]])
        if ((age + dx * 3 | 0) % 3) R(e.type === 'check' ? '#9ece6a' : '#f6d365', cx + dx * r, cy + dy * r, 1, 1);
      if (e.type === 'check') bubble(R, x + 20, 56 - (age >> 2), '✓', '#2f8f3a', 0);
    }
  }
}

function drawRoom(cv, room, F, o) {
  const f = Math.floor(F);   // poses and flicker step by frame; walking and dust use F
  const n = room.desks.length, w = Math.max(256, n * SW + LW), h = RH + (o.caption != null ? 16 : 0);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const R = (c, x, y, ww, hh) => { if (ww > 0 && hh > 0) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); } };
  const pad = Math.round((w - n * SW - LW) / 2), L0 = pad + n * SW;
  o.pad = pad;
  const away = room.desks.map((d, i) => (d.away = plan(d, i, F, L0, pad + i * SW)));
  const occ = {wc: away.some(a => a && a.pose === 'in'), coffee: away.some(a => a && a.pose === 'stand'),
               tv: away.some(a => a && a.pose === 'sit')};
  backdrop(R, g, w, f, o);
  lounge(R, g, L0, f, occ);
  room.desks.forEach((d, i) => station(R, g, pad + i * SW, d, f, o));
  room.desks.forEach((d, i) => { if (away[i]) actor(R, d, away[i], f, i); });
  room.desks.forEach((d, i) => { if (!d.live) return;          // dust drifting through the lamp light
    const x0 = pad + i * SW;
    for (let k = 0; k < 5; k++) {
      const y = 12 + ((F * .25 + k * 11) % 44), x = x0 + 33 + Math.sin(F * .03 + k * 2.1) * (6 + y / 5);
      R('rgba(255,226,170,' + (.45 * Math.sin(Math.PI * (y - 12) / 44)).toFixed(2) + ')', x, 56 + y, 1, 1);
    } });
  for (const spot of ['coffee', 'tv']) {            // two on a break together get talking
    const here = away.filter(a => a && a.spot === spot && a.pose !== 'walk');
    if (here.length < 2 || f % 40 >= 28) continue;
    const k = Math.floor(f / 40), a = here[k % here.length];
    bubble(R, a.x - 4, spot === 'tv' ? 66 : 58, '?!·#'[k % 4], '#3b4261', (f >> 2) % 2);
  }
  effects(R, room, pad, F, o.fx);
  if (o.dawn) { g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,150,70,' + (.09 * o.dawn * (1 - (o.day || 0))) + ')'; g.fillRect(0, 56, w, RH - 56); g.globalCompositeOperation = 'source-over'; }
  const vg = g.createRadialGradient(w / 2, RH / 2, RH * .4, w / 2, RH / 2, w * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.38)');
  g.fillStyle = vg; g.fillRect(0, 0, w, RH);
  if (REEL || window.PUB) {                                     // the reel travels: sign it
    const m = 'GITHUB.COM/MMR710/NIGHTMUX';
    text(R, m, w - tw(m) - 4, RH - 7, 'rgba(224,175,104,.75)');
  }
  if (o.caption != null) {
    R('#07090f', 0, RH, w, 16); R('#1b2133', 0, RH, w, 1);
    const [head, rest] = o.caption.split('|');
    text(R, head, 6, RH + 6, '#e0af68'); if (rest) text(R, rest, 10 + tw(head), RH + 6, '#cdd6f4');
  }
  return pad;
}

   s: {claude: 'limit', codex: 'busy', agy: 'waiting', opencode: 'idle'}},
  {at: 104, clock: '03:02', cap: 'YOU|tap yes on your phone', live: 'codex', fx: {type: 'check', on: 'agy'},
   s: {claude: 'limit', codex: 'busy', agy: 'busy', opencode: 'busy'}},
  {at: 120, clock: '04:11', cap: '04:11|the window resets, claude is back', live: 'claude',
   fx: {type: 'sparkle', on: 'claude'}, s: {claude: 'busy', codex: 'busy', agy: 'busy', opencode: 'busy'}},
  {at: 146, clock: '07:30', cap: 'NIGHTMUX|your night crew  github.com/mmr710/nightmux', live: 'claude',
   s: {claude: 'idle', codex: 'idle', agy: 'idle', opencode: 'idle'}},
];
function scene(t) {
  const raw = t;
  t = ((t % LOOP) + LOOP) % LOOP;
  let k = 0; while (k + 1 < STORY.length && STORY[k + 1].at <= t) k++;
  const step = STORY[k], since = a => { let at = 0;
    for (let j = 1; j <= k; j++) if (STORY[j].s[a] !== STORY[j - 1].s[a]) at = STORY[j].at;
    return at + raw - t; };
  const room = {topic: 'demo', name: 'the night shift', desks: CAST.map(a => ({
    agent: a, session: a, live: step.live === a, state: step.s[a], queued: (step.q || {})[a] || 0, since: since(a),
    prog: step.s[a] === 'limit' ? (t - 26) / 94 : 0}))};
  const fx = STORY.filter(s => s.fx && t >= s.at).map(s => Object.assign({start: s.at}, s.fx));
  if (t >= 146) for (const a of CAST) fx.push({type: 'sparkle', on: a, start: 146 + CAST.indexOf(a) * 3});
  return {room, o: {nodim: true, clock: step.clock, caption: step.cap, dawn: t < 120 ? 0 : Math.min(1, (t - 120) / 40), fx}};
}

// ---------- live ----------
let data = {rooms: [], installed: [], usage: {}}, frame = 0, open = null, lastSig = '', auto = true;
const prev = {}, prevLive = {}, fx = {}, since = {};
function track() {
  for (const r of data.rooms) {
    const live = (r.desks.find(d => d.live) || {}).session;
    if (prevLive[r.topic] && live && prevLive[r.topic] !== live)
      (fx[r.topic] = fx[r.topic] || []).push({type: 'folder', from: prevLive[r.topic], to: live, start: frame});
    prevLive[r.topic] = live;
    for (const d of r.desks) {
      const k = r.topic + '|' + d.session;
      if (prev[k] !== d.state) since[k] = frame;
      d.since = since[k] || 0;
      if (prev[k] === 'busy' && d.state === 'idle') (fx[r.topic] = fx[r.topic] || []).push({type: 'sparkle', on: d.session, start: frame});
      if (prev[k] && prev[k] !== d.state)
        beep(d.state === 'waiting' ? SOUND.waiting : d.state === 'limit' ? SOUND.limit
             : d.state === 'idle' && prev[k] === 'busy' ? SOUND.done : []);
      prev[k] = d.state;
      if (d.state === 'limit' && d.until) d.prog = 1 - (d.until - Date.now() / 1000) / 18000;
    }
    fx[r.topic] = (fx[r.topic] || []).filter(e => frame - e.start < 20);
  }
}
function left(until) {
  const s = Math.max(0, until - Date.now() / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + 'h' + String(m).padStart(2, '0') : m + 'm';
}
function label(d) {
  return {busy: 'working', idle: 'idle', waiting: '✋ asking', limit: '💤 ' + (d.until ? left(d.until) : ''),
          unknown: '? unread screen', shell: 'exited', gone: 'gone'}[d.state] || d.state;
}
const hhmm = () => new Date(T || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hour12: false});
// The window follows the viewer's clock: night, dawn from 5, day from 7, dusk to 21. ?hour=14 previews.
function sky() {
  const n = new Date(T || Date.now()), h = Q.has('hour') ? +Q.get('hour') : n.getHours() + n.getMinutes() / 60;
  const ramp = (a, b) => Math.max(0, Math.min(1, Math.min((h - a) / 2, (b - h) / 2)));
  return {dawn: ramp(5, 21), day: ramp(7, 19)};
}
// Sounds, off until the 🔈 button turns them on (remembered per browser).
let audio = null, sound = false;
try { sound = localStorage.getItem('nm-sound') === '1'; } catch (e) {}
function beep(notes) {
  if (!sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([hz, at], i) => { const o = audio.createOscillator(), v = audio.createGain(), t = audio.currentTime + at;
      o.type = 'square'; o.frequency.value = hz; v.gain.setValueAtTime(.04, t); v.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(v); v.connect(audio.destination); o.start(t); o.stop(t + .2); });
  } catch (e) {}
}
const SOUND = {done: [[660, 0], [880, .1]], waiting: [[988, 0], [988, .16]], limit: [[330, 0], [247, .14]]};
// Skins: a colour grade over every canvas — the art stays, the mood changes.
const SKINS = ['night', 'sunset', 'matrix', 'gameboy', 'vapor', 'mono'];
let skin = Q.get('skin') || '';
try { skin = skin || localStorage.getItem('nm-skin') || 'night'; } catch (e) { skin = skin || 'night'; }
document.body.dataset.skin = skin;
function nextSkin() {
  skin = SKINS[(SKINS.indexOf(skin) + 1) % SKINS.length];
  document.body.dataset.skin = skin;
  try { localStorage.setItem('nm-skin', skin); } catch (e) {}
  toast('skin: ' + skin);
}
function toggleSound() {
  sound = !sound;
  try { localStorage.setItem('nm-sound', sound ? '1' : '0'); } catch (e) {}
  document.getElementById('snd').textContent = sound ? '🔊' : '🔈';
  beep(SOUND.done);
}

function build() {
  const main = document.getElementById('rooms');
  main.innerHTML = data.rooms.length ? '' : '<p class="empty">no topics bound</p>';
  data.rooms.forEach(r => {
    const el = document.createElement('section');
    el.className = 'room';
    el.innerHTML = '<h2><span class="nm"></span><span class="tid"></span></h2><canvas></canvas><div class="chips"></div>';
    el.querySelector('.nm').textContent = r.name;
    el.querySelector('.tid').textContent = '#' + r.topic;
    const cv = el.querySelector('canvas');
    cv.onclick = e => { const b = cv.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * cv.width;
      const i = Math.floor((x - (cv.pad || 0)) / SW); if (i >= 0 && i < r.desks.length) pick(r.topic, i); };
    r.desks.forEach((d, i) => { const b = document.createElement('button');
      b.className = 'chip'; b.onclick = () => pick(r.topic, i); el.querySelector('.chips').appendChild(b); });
    main.appendChild(el);
  });
}

function render() {
  const sig = data.rooms.map(r => r.topic + ':' + r.desks.map(d => d.session).join(',')).join('|');
  if (sig !== lastSig) { lastSig = sig; build(); }
  track();
  let asking = 0;
  document.querySelectorAll('.room').forEach((el, i) => {
    el.querySelectorAll('.chip').forEach((b, j) => { const d = data.rooms[i].desks[j];
      asking += d.state === 'waiting';
      b.classList.toggle('alert', d.state === 'waiting');
      b.innerHTML = '<b style="color:' + color(d.agent) + '">●</b> ' + esc(d.agent) + (d.live ? ' ★' : '')
        + ' · ' + esc(label(d)) + (d.queued ? ' · 📝' + d.queued : ''); });
  });
  document.title = (asking ? '✋' + asking + ' ' : '') + 'nightmux office';
    for (const [id, k] of [['u5', 'five_hour'], ['u7', 'seven_day'], ['agy_b', 'agy_limit'], ['oc_b', 'oc_limit']]) {
    const p = data.usage[k], bar = document.getElementById(id);
    if(bar) {
      if(p != null) bar.parentElement.style.display = '';
      bar.querySelector('i').style.width = (p == null ? 0 : Math.min(100, p)) + '%';
      bar.classList.toggle('hot', p >= 80); bar.title = p == null ? 'no figure yet' : Math.round(p) + '%';
    }
  }
  if(data.usage.agy_model && document.getElementById('agy_stat')) document.getElementById('agy_stat').title = 'agy model: ' + data.usage.agy_model;
  if(data.usage.oc_model && document.getElementById('oc_stat')) document.getElementById('oc_stat').title = 'opencode model: ' + data.usage.oc_model;

  if (open) sheet();
}

function pick(topic, i) { if (window.PUB || REPLAY) return; const r = data.rooms.find(x => x.topic === topic);
  open = {topic, session: r.desks[i].session}; sheet(); }

function sheet() {
  const el = document.getElementById('sheet');
  const r = data.rooms.find(x => x.topic === open.topic), d = r && r.desks.find(x => x.session === open.session);
  if (!d) { el.classList.remove('open'); open = null; return; }
  const old = el.querySelector('input'), typed = old ? old.value : '', focused = old && document.activeElement === old;
  el.innerHTML = '';
  const add = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text;
    if (cls) n.className = cls; el.appendChild(n); return n; };
  const x = add('button', 'close', 'x'); x.onclick = () => { open = null; el.classList.remove('open'); };
  add('h3', d.agent + ' · ' + d.session + (d.live ? '  ★ live' : '  (benched)'));
  add('div', [label(d), d.ctx != null ? 'ctx ' + Math.round(d.ctx) + '%' : '', d.queued ? d.queued + ' queued' : '',
              r.name].filter(Boolean).join(' · '), 'meta');
  if (d.doing) add('pre', d.doing);
  if (d.screen.length) { const t = add('pre', d.screen.join('\n'), 'term'); t.scrollTop = t.scrollHeight; }
  if (!window.PUB) { const a = add('a', 'full terminal ↗', 'meta'); a.href = '/term/' + open.topic + '?agent=' + d.agent; a.target = '_blank'; }
  const acts = [];
  if (d.state === 'waiting') (d.options || []).forEach(o => acts.push([o.text, o.send, /^\d/.test(o.text) ? 'go' : '']));
  if (!d.live) acts.push(['★ make live', '!' + d.agent]);
  if (d.state === 'limit' && d.live) data.installed.filter(k => k !== d.agent)
    .forEach(k => acts.push(['⏭ hand to ' + k, '!failover ' + k, 'go']));
  if ((d.state === 'gone' || d.state === 'shell') && d.live) acts.push(['↻ restore', '!restore', 'go']);
  if (d.state === 'busy') acts.push(['esc', '!esc ' + d.session]);
  if (acts.length) { const row = add('div', null, 'btns');
    acts.forEach(([t, cmd, cls]) => { const b = document.createElement('button'); b.textContent = t;
      if (cls) b.className = cls; b.onclick = () => send(open.topic, cmd); row.appendChild(b); }); }
  const form = add('form'), input = document.createElement('input'), go = document.createElement('button');
  input.placeholder = d.live ? 'prompt…' : 'prompt ' + d.agent + ' without switching…';
  input.autocomplete = 'off'; input.value = typed; go.textContent = 'send'; go.className = 'go';
  form.append(input, go);
  form.onsubmit = e => { e.preventDefault(); const t = input.value.trim(); if (!t) return;
    send(open.topic, d.live ? t : '@' + d.agent + ' ' + t); input.value = ''; };
  if (focused) { input.focus(); input.setSelectionRange(typed.length, typed.length); }
  el.classList.add('open');
}

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

async function send(topic, text) {
  try { const r = await fetch('/topic/' + encodeURIComponent(topic), {method: 'POST', headers: {'X-Nightmux': '1'}, body: text});
    toast(r.ok ? 'sent ✓ — replies land in Telegram' : 'failed: ' + r.status); }
  catch (e) { toast('failed: ' + e); }
  setTimeout(poll, 700);
}

async function poll() {
  try {
    data = await (await fetch(window.PUB ? '/public/' + PUB + '/api' : '/api/office', {cache: 'no-store'})).json();
    for (const [k, v] of Object.entries(data.looks || {})) LOOK[k] = Object.assign({}, look(k), v);
    const off = data.rooms.filter(r => r.offline);
    data.rooms = data.rooms.filter(r => !r.offline);
    const sv = data.servers || [];
    document.getElementById('srvs').innerHTML = sv.length > 1 ? sv.map(x =>
      '<span class="sdot" style="background:' + (x.ok ? '#3fb950' : '#f85149') + '"></span>' + esc(x.name)).join('') : '';
    const down = sv.filter(x => !x.ok);
    document.getElementById('offline').innerHTML = down.length ? down.map(x =>
      '⚠ <b>' + esc(x.name) + '</b> is not answering — ' +
      (off.filter(r => r.server === x.name).map(r => esc(r.name.split(' · ')[0])).join(', ') || 'no topics') +
      ' not shown. Check it on the <a href="/#servers">dashboard → servers</a>.').join('<br>') : '';
    render();
  } catch (e) {}
  document.getElementById('clock').textContent = hhmm();
}

function draw() {
  if (DEMO || REEL) {
    // ?reel: one recorded moment of the night, handed over in the URL hash.
    const {room, o} = REEL ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : scene(frame),
          cv = document.getElementById('stage');
    drawRoom(cv, room, frame, o);
    cv.style.width = cv.width * (+Q.get('scale') || 3) + 'px';
    return;
  }
  document.querySelectorAll('.room canvas').forEach((cv, i) => { const r = data.rooms[i];
    if (r) cv.pad = drawRoom(cv, r, frame, Object.assign({clock: hhmm(), fx: fx[r.topic]}, sky())); });
}

// ?replay: the last day as recorded, on a slider. Same rooms, same drawing.
async function replay() {
  document.body.classList.add('replay');
  const bar = document.getElementById('rp'), s = document.getElementById('rps'),
    btn = document.getElementById('rpp'), lab = document.getElementById('rpt');
  bar.hidden = false;
  let F = [];
  try { F = (await (await fetch('/api/office/replay', {cache: 'no-store'})).json()).frames || []; } catch (e) {}
  if (!F.length) { lab.textContent = 'nothing recorded yet — the office records while nightmux runs'; return; }
  s.max = F.length - 1;
  const show = i => { const f = F[i]; T = f.t * 1000; data = {rooms: f.rooms, installed: [], usage: {}};
    lab.textContent = new Date(T).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false})
      + '  ·  ' + (i + 1) + '/' + F.length;
    render(); };
  let timer = null;
  s.oninput = () => show(+s.value);
  btn.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶'; return; }
    if (+s.value >= F.length - 1) s.value = 0;
    btn.textContent = '⏸';
    timer = setInterval(() => { if (+s.value >= F.length - 1) return btn.onclick();
      s.value = +s.value + 1; show(+s.value); }, 350);
  };
  // Start where the night did: the first frame after 22:00 last night, if there is one.
  const eve = new Date(); eve.setDate(eve.getDate() - (eve.getHours() < 12 ? 1 : 0)); eve.setHours(22, 0, 0, 0);
  const i0 = F.findIndex(f => f.t * 1000 >= eve.getTime());
  s.value = i0 > 0 ? i0 : 0; show(+s.value);
}

// GIF capture drives frames itself, one exact frame per call.
window.__frame = n => { auto = false; frame = n; draw(); };
if (REEL) { auto = false; frame = +Q.get('f') || 0; }
if (DEMO || REEL) document.body.classList.add('demo');
if (REEL) { document.getElementById('rtitle').style.display = 'block'; document.getElementById('rtitle').textContent = Q.get('t') || 'NIGHTMUX REEL'; }
if (window.PUB) document.body.classList.add('pub');
if (sound) document.getElementById('snd').textContent = '🔊';
if (REPLAY) replay();
else if (!DEMO && !REEL) { poll(); setInterval(poll, 2000); }
// The story runs on 110 ms frames; drawing runs at ~30 fps in between them, so a
// walk moves a pixel at a time instead of hopping two.
let lastT = 0;
(function loop(now) {
  requestAnimationFrame(loop);
  if (!auto || now - lastT < 33) { if (!auto) lastT = now; return; }
  frame += Math.min(now - lastT, 250) / 110; lastT = now; draw();
})(0);
draw();
</script>
</body></html>
