[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nightmux"
version = "1.5.0"
description = "Your AI coding agents keep working while you sleep: drive Claude Code, Codex, Gemini, opencode and more from your phone, past usage limits."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Mohamed Raslan" }]
keywords = ["claude-code", "codex", "gemini-cli", "opencode", "coding-agent", "ai-agents", "vibe-coding", "usage-limit", "telegram", "tmux", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
# No dependencies, and that is a feature: see README.

[project.urls]
Homepage = "https://mmr710.github.io/nightmux/"
Source = "https://github.com/mmr710/nightmux"
Documentation = "https://github.com/mmr710/nightmux/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/mmr710/nightmux/blob/main/CHANGELOG.md"
Issues = "https://github.com/mmr710/nightmux/issues"

[project.scripts]
nightmux = "nightmux:cli"

# Flat modules rather than a package: the Claude Code hooks are separate
# processes launched by path, so they have to land on disk as runnable files
# next to nightmux.py — which is exactly what py-modules does.
[tool.setuptools]
py-modules = ["nightmux", "nightmux_stop", "nightmux_notify", "nightmux_state"]
