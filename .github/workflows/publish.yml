# Publish to PyPI when a GitHub release is published.
#
# No API token anywhere: this uses PyPI Trusted Publishing (OIDC). One-time setup
# at https://pypi.org/manage/account/publishing/ — owner mmr710, repository
# nightmux, workflow publish.yml, environment left blank. The name is not on PyPI
# yet, so it is the "pending publisher" form: that is the supported way to claim a
# name on first upload. Until it exists this job fails at the last step and
# nothing else is affected.
#
# Manual trigger as well as the release event, because the release event fires
# exactly once per release. v1.1.0 published a minute after this repository was
# created, produced no run, and was then unrepeatable — leaving a README that
# tells people to `pipx install nightmux` and a badge reading "not found", with
# no way to fix it short of inventing a version number.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # no id-token: the token below is what authenticates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      # Trusted publishing kept refusing the claim set with `invalid-publisher`,
      # so this falls back to an API token in the `PYPI` repository secret. A
      # name that does not exist reads as empty rather than failing, and the
      # action then tries OIDC and reports a permissions error — so if this step
      # ever complains about ACTIONS_ID_TOKEN, check the secret name first.
      #
      # It is a long-lived credential in a place this project would rather not
      # have one: scope it to the nightmux project as soon as the first upload
      # has created it, and delete it entirely once trusted publishing works —
      # restore `id-token: write` above and drop `with:`.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI }}
