name: drift-guard

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/drift-guard.yml'
      - 'tests/**'

permissions:
  contents: read   # it runs the newest release of six third-party CLIs

jobs:
  drift-guard:
    runs-on: ubuntu-22.04
    continue-on-error: true # Allowed to fail, posts a summary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y tmux

      - name: install headless agent CLIs
        run: |
          echo "Installing available headless agent CLIs..."
          npm install -g @google/gemini-cli || true
          npm install -g @qwen-code/qwen-code || true
          npm install -g @anthropic-ai/claude-code || true
          npm install -g @openai/codex || true
          npm install -g opencode-ai || true
          # Claude Code's and OpenCode's own installers go first on PATH: npm's
          # opencode-ai is a major version behind, and the claude found on the
          # first run was older than the one on npm.
          curl -fsSL https://claude.ai/install.sh | bash || true
          curl -fsSL https://opencode.ai/install | bash || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          pip install --no-cache-dir aider-chat || true

      - name: run pane classifier tests
        run: python3 tests/test_panes.py

      - name: run reader fixture tests
        run: python3 tests/test_readers.py

      - name: run nightmux selfcheck
        run: python3 nightmux.py --selfcheck

      # The newest releases, started for real: their versions and how nightmux
      # reads each first screen go to the run's summary.
      - name: read each agent's first screen
        run: python3 tests/live_agents.py agent-screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-screens
          path: agent-screens

  # The page is landed by a pull request, never a push to protected main. It
  # gets write rights here, in a job of its own that runs no third-party CLI.
  publish:
    needs: drift-guard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: agent-screens
          path: agent-screens
      - name: open a PR with docs/status.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No status.html means the run crashed before it wrote one: fail loudly, publish nothing.
          test -f agent-screens/status.html || { echo "drift-guard produced no status.html"; exit 1; }
          cp agent-screens/status.html docs/status.html
          git diff --quiet -- docs/status.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B status-page
          git add docs/status.html
          git commit -m "docs: agent status page"
          git push -f origin status-page
          gh pr create --base main --head status-page --title "docs: agent status page" \
            --body "Nightly update of docs/status.html from the drift guard." \
            || gh pr edit status-page --body "Nightly update of docs/status.html from the drift guard."
